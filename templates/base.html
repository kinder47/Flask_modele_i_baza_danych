<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>{% block tytul %}Sklep 4TP{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <a href="{{ url_for('index') }}">Start</a> |
        <a href="{{ url_for('produkty') }}">Produkty</a>
    </nav>
    <main>
        {% block tresc %}{% endblock %}
    </main>
    <footer>4TP 2026</footer>

<form method="get" action="{{ url_for('szukaj') }}">
    <input name="q" placeholder="Szukaj..." value="{{ q or '' }}">
    <button>Szukaj</button>
</form>

<form method="post" action="dodaj">
    <label>Nazwa: <input name="nazwa" required></label><br>
    <label>Cena: <input name="cena" type="number" step="0.01" required></label><br>
    <button>Dodaj</button>
</form>

</body>
</html>
